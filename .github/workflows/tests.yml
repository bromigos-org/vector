# The offline tests on every pull request and every push to main: the merge tool's limits
# and his clones (test-devflow.py, in his bubblewrap sandbox), the privacy guard, a user's
# own systems and their real money (test-plugin-systems.py) and the launcher. VECTOR's merge tool (holo/vector/devflow.py) merges his own PRs only when these
# checks are green. Nothing here uses a secret.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # bubblewrap for his sandbox; Ubuntu's AppArmor blocks the user namespaces it needs
      # unless this is switched off on the runner
      - name: Sandbox and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap desktop-file-utils poppler-utils >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python3 -m pip install --quiet --user 'bashlex==0.18' psutil pyyaml numpy pillow

      - name: Compile
        run: python3 -m compileall -q holo tools lib evals

      - name: His clones and the merge tool's limits
        run: python3 tools/test-devflow.py

      - name: The privacy guard
        run: python3 tools/test-privacy-guard.py

      - name: A user's own systems (plugins) and their real money
        run: python3 tools/test-plugin-systems.py

      - name: Media requests (his tools and his terminal's limits)
        run: python3 tools/test-media.py

      - uses: actions/checkout@v5
        with:
          repository: bromigos-org/bromigOS
          path: .bromigos-test
      - name: Den TV tools (sandbox config and shared channel library)
        run: python3 tools/test-tv-channels.py --bromigos .bromigos-test

      - name: Claude Code's records (read only, redacted, follow mode)
        run: python3 tools/test-claude.py

      - name: Attachments (never a secret, data not instructions, references only)
        run: python3 tools/test-attach.py

      - name: He speaks with his real voice (the portrait's voice, the projector's speakers)
        run: python3 tools/test-talk.py

      - name: The launcher
        run: |
          python3 tools/test-launcher-verbs.py
          python3 tools/test-launcher-entries.py
