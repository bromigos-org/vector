name: An idea
description: Suggest a change or something new for VECTOR.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How VECTOR could help. An example conversation helps too.
    validations:
      required: true
